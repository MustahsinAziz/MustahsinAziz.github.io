<div class="container">
  <h1 style="text-align: center; margin-bottom: 30px;">Curriculum Vitae</h1>
  
  <!-- Fallback links for testing -->
  <div style="text-align: center; margin-bottom: 20px;">
    <a href="assets/Aziz_CV.pdf" target="_blank" class="btn btn-primary">Open PDF in New Tab</a>
    <a href="assets/Aziz_CV.pdf" download class="btn btn-secondary" style="margin-left: 10px;">Download CV</a>
  </div>
  
  <!-- PDF Iframe -->
  <div style="text-align: center; border: 2px solid #ddd; border-radius: 5px; overflow: hidden;">
    <iframe id="cv-iframe" 
            src="assets/Aziz_CV.pdf" 
            style="width: 100%; height: 80vh; min-height: 600px; border: none;" 
            frameborder="0"
            onload="console.log('PDF loaded successfully')"
            onerror="console.log('Error loading PDF')">
      <p>Your browser does not support viewing PDFs inline. 
         <a href="assets/Aziz_CV.pdf" target="_blank">Click here to view the PDF</a>
      </p>
    </iframe>
  </div>
  
  <!-- Fallback message -->
  <div style="text-align: center; margin-top: 20px;">
    <small>If the PDF doesn't display above, try the direct links or check your browser's PDF settings.</small>
  </div>
</div>

<script>
// Add some debugging
document.addEventListener('DOMContentLoaded', function() {
  const iframe = document.getElementById('cv-iframe');
  
  iframe.addEventListener('load', function() {
    console.log('Iframe loaded');
  });
  
  iframe.addEventListener('error', function() {
    console.log('Error loading iframe');
    // Show fallback message
    const fallback = document.createElement('div');
    fallback.innerHTML = '<p style="text-align: center; color: red; padding: 20px;">Unable to display PDF. <a href="assets/Aziz_CV.pdf" target="_blank">Click here to view directly</a></p>';
    iframe.parentNode.replaceChild(fallback, iframe);
  });
});
</script>
